services:
  db:
    restart: "no"
    ports:
      - "${DB_PORT:-3306}:3306"

  backend:
    restart: "no"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  frontend:
    restart: "no"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules