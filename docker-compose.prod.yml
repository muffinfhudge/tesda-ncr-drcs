services:
  db:
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"